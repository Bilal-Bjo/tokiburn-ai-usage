name: Tokiburn
options:
  bundleIdPrefix: com.bilal
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Tokiburn:
    type: application
    platform: macOS
    sources:
      - Tokiburn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilal.tokiburn
        PRODUCT_NAME: Tokiburn
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tokiburn
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
  TokiburnTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TokiburnTests
    dependencies:
      - target: Tokiburn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilal.tokiburn.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tokiburn:
    build:
      targets:
        Tokiburn: all
        TokiburnTests: [test]
    test:
      targets:
        - TokiburnTests
